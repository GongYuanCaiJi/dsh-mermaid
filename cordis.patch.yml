# dsh-mermaid bundle layer.
#
# When this package is listed in a profile's dsh.profile.bundles, this patch
# is applied over the profile composition: it INSERTS one plugin row that
# renders ```mermaid fenced blocks as SVG diagrams in the web client.
#
# The row ships with an EMPTY config so installing the bundle never breaks
# boot; the plugin needs no configuration to work.
- insert:
    - id: mermaid
      name: dsh-mermaid
      config: {}
